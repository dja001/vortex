# tmux config for vortex sessions. Used only by the private tmux server
# `tmux -L vortex`, so your own tmux setup is untouched.
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 20000
set -g default-terminal "screen-256color"
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] vortex #[default]#S  "
set -g status-left-length 40
set -g status-right "%H:%M "
# Alt+arrows: move between vim and the Claude pane without the prefix
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

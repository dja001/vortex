# tmux config for vortex sessions. Used only by the private tmux server
# `tmux -L vortex`, so your own tmux setup is untouched.
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 20000
set -g default-terminal "screen-256color"
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] vortex #[default]#S  "
set -g status-left-length 40
set -g status-right "%H:%M "
# Alt+arrows: move between vim and the Claude pane without the prefix
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Ctrl-w: vim window commands that also cross into the Claude pane.
# In the vim pane, Ctrl-w goes to vim (vortex.vim leaves vim at its edges).
# Elsewhere, Ctrl-w followed by w/Ctrl-w/W/k returns to the vim pane;
# the file in @vortex_wrapfile tells vim which window to land on (first or last, as in a
# wrapping Ctrl-w w / Ctrl-w W), through a file that vim polls (focus events
# would do, but their escape codes can leak into vim's screen). Ctrl-w
# followed by anything else sends a literal Ctrl-w.
bind -n C-w if -F "#{@vortex_vim}" "send-keys C-w" "switch-client -T vortexw"
bind -T vortexw w   run-shell "echo first > #{q:@vortex_wrapfile}" \; select-pane -U
bind -T vortexw C-w run-shell "echo first > #{q:@vortex_wrapfile}" \; select-pane -U
bind -T vortexw W   run-shell "echo last > #{q:@vortex_wrapfile}" \; select-pane -U
bind -T vortexw k   select-pane -U
bind -T vortexw C-k select-pane -U
bind -T vortexw Any send-keys C-w
